<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Diretrizes & Governança de IA</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>

  <!-- Marked (Markdown parser) & Highlight.js (Code syntax highlighting) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    .markdown-body h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e2e8f0;
      color: #0f172a;
    }
    .markdown-body h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
      color: #1e293b;
    }
    .markdown-body h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      color: #334155;
    }
    .markdown-body p {
      margin-bottom: 1rem;
      line-height: 1.7;
      color: #334155;
    }
    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
      color: #334155;
    }
    .markdown-body ul { list-style-type: disc; }
    .markdown-body ol { list-style-type: decimal; }
    .markdown-body li { margin-bottom: 0.35rem; line-height: 1.6; }
    .markdown-body blockquote {
      border-left: 4px solid #0284c7;
      background-color: #f8fafc;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      border-radius: 0 0.5rem 0.5rem 0;
      color: #475569;
    }
    .markdown-body pre {
      background-color: #1e293b;
      border-radius: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      margin: 1.25rem 0;
      position: relative;
    }
    .markdown-body pre code {
      background-color: transparent;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.875rem;
    }
    .markdown-body code:not(pre code) {
      background-color: #f1f5f9;
      color: #0369a1;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
      border: 1px solid #e2e8f0;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #cbd5e1;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    .markdown-body th {
      background-color: #f1f5f9;
      font-weight: 600;
    }
    .markdown-body hr {
      border: 0;
      border-top: 1px solid #e2e8f0;
      margin: 2rem 0;
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col antialiased">

  <!-- Header Superior -->
  <header id="header-container" class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand & Mobile Toggle -->
      <div class="flex items-center gap-3">
        <button id="mobile-menu-btn" class="lg:hidden p-2 rounded-md hover:bg-slate-100 text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500" aria-label="Abrir Menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-lg bg-sky-700 flex items-center justify-center text-white font-bold shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <div>
            <span class="font-bold text-slate-900 text-lg leading-tight block">Diretrizes de IA</span>
            <span class="text-xs text-slate-500 font-medium leading-none block">Documentação Dinâmica GitHub</span>
          </div>
        </div>
      </div>

      <!-- Links & Status -->
      <div class="flex items-center gap-3">
        <button id="btn-refresh" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-md transition-colors" title="Forçar recarregamento do GitHub">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Atualizar Regras
        </button>
        <a id="github-repo-link" href="https://github.com/JeffMR/diretrizes-ia" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-3.5 py-1.5 text-xs font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-lg shadow-sm transition-colors">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          Repositório
        </a>
      </div>
    </div>
  </header>

  <!-- Container Principal -->
  <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 flex-1 flex overflow-hidden">
    
    <!-- Barra Lateral (Navegação Dinâmica) -->
    <aside id="sidebar-menu" class="fixed inset-y-0 left-0 z-30 w-72 bg-white border-r border-slate-200 p-4 transform -translate-x-full transition-transform duration-200 ease-in-out lg:static lg:translate-x-0 lg:w-64 xl:w-72 flex flex-col shrink-0 overflow-y-auto">
      
      <!-- Busca Rápida -->
      <div class="mb-4">
        <label for="search-input" class="sr-only">Pesquisar diretrizes</label>
        <div class="relative">
          <input type="text" id="search-input" placeholder="Buscar regra ou pasta..." class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white text-slate-700">
          <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Indicador de Carregamento da Árvore -->
      <div id="tree-loader" class="py-4 text-center text-xs text-slate-400 flex items-center justify-center gap-2">
        <svg class="animate-spin h-4 w-4 text-sky-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        Lendo repositório GitHub...
      </div>

      <!-- Navegação de Pastas e Arquivos Gerada Dinamicamente -->
      <nav id="nav-tree" class="space-y-4 flex-1 text-sm select-none" aria-label="Navegação da Documentação">
        <!-- Itens inseridos via JavaScript -->
      </nav>

      <!-- Rodapé do Menu -->
      <div class="pt-4 border-t border-slate-100 text-[11px] text-slate-400 flex items-center justify-between">
        <span>Sincronizado com GitHub</span>
        <span id="last-sync-time">Hoje</span>
      </div>
    </aside>

    <!-- Overlay Mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 z-20 hidden lg:hidden backdrop-blur-xs"></div>

    <!-- Área de Conteúdo Central -->
    <main id="content-container" class="flex-1 min-w-0 py-6 lg:py-8 lg:pl-8 xl:pl-10 overflow-y-auto">
      
      <!-- Cabeçalho do Documento Atual -->
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-200">
        <div>
          <nav class="flex items-center gap-1.5 text-xs text-slate-500 mb-1" aria-label="Breadcrumb">
            <span id="doc-section-badge" class="font-medium text-sky-700 bg-sky-50 px-2 py-0.5 rounded uppercase tracking-wider text-[10px]">Geral</span>
            <span class="text-slate-300">/</span>
            <span id="doc-path" class="text-slate-600 font-mono">README.md</span>
          </nav>
          <h1 id="doc-title" class="text-2xl font-bold text-slate-900 tracking-tight">Carregando documentação...</h1>
        </div>
        <div class="flex items-center gap-2">
          <a id="edit-github-btn" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 rounded-md transition-colors shadow-2xs">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Editar no GitHub
          </a>
        </div>
      </div>

      <!-- Conteúdo Markdown Renderizado -->
      <article id="doc-body" class="markdown-body bg-white p-6 sm:p-8 rounded-xl border border-slate-200/80 shadow-2xs">
        <div class="py-12 text-center text-slate-400">
          <svg class="animate-spin h-6 w-6 text-sky-600 mx-auto mb-3" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Buscando o conteúdo do arquivo no GitHub...
        </div>
      </article>

    </main>

  </div>

  <!-- Script Lógica Dinâmica -->
  <script>
    // ==========================================
    // CONFIGURAÇÃO DO REPOSITÓRIO GITHUB
    // ==========================================
    const GITHUB_USER = 'JeffMR';
    const GITHUB_REPO = 'diretrizes-ia';
    const GITHUB_BRANCH = 'main';

    const API_TREE_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;
    const RAW_BASE_URL = `https://raw.githubusercontent.com/JeffMR/${GITHUB_REPO}/${GITHUB_BRANCH}`;

    // Nomes amigáveis para as pastas/seções
    const SECTION_LABELS = {
      'root': 'Visão Geral & Inicialização',
      'global': 'Regras Globais & Autorização',
      'tecnologia': 'Arquitetura & Stack Tecnológica',
      'governanca': 'Governança, Logs & Docs',
      'interface': 'Padrões de UI & Responsividade'
    };

    // Estado da Aplicação
    let filesTree = [];
    let activeFilePath = '';
    let cachedFilesContent = {};

    // Elementos DOM
    const navTreeEl = document.getElementById('nav-tree');
    const treeLoaderEl = document.getElementById('tree-loader');
    const docBodyEl = document.getElementById('doc-body');
    const docTitleEl = document.getElementById('doc-title');
    const docPathEl = document.getElementById('doc-path');
    const docSectionBadgeEl = document.getElementById('doc-section-badge');
    const editGithubBtn = document.getElementById('edit-github-btn');
    const searchInput = document.getElementById('search-input');
    const lastSyncTimeEl = document.getElementById('last-sync-time');
    const btnRefresh = document.getElementById('btn-refresh');

    // Menu Mobile
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    function toggleMobileMenu() {
      const isOpen = !sidebarMenu.classList.contains('-translate-x-full');
      if (isOpen) {
        sidebarMenu.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
      } else {
        sidebarMenu.classList.remove('-translate-x-full');
        sidebarOverlay.classList.remove('hidden');
      }
    }

    mobileMenuBtn.addEventListener('click', toggleMobileMenu);
    sidebarOverlay.addEventListener('click', toggleMobileMenu);

    // Formatar nome amigável de arquivo
    function formatFileName(fileName) {
      const clean = fileName.replace(/\.md$/i, '').replace(/_/g, ' ').replace(/-/g, ' ');
      return clean.charAt(0).toUpperCase() + clean.slice(1);
    }

    // Configurar Marked com Highlight.js
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      breaks: true,
      gfm: true
    });

    // 1. Carregar a Árvore de Arquivos Dinâmica do GitHub
    async function loadGitHubTree(forceRefresh = false) {
      treeLoaderEl.classList.remove('hidden');
      const cacheKey = `gh_tree_${GITHUB_USER}_${GITHUB_REPO}`;
      
      let rawTree = null;

      if (!forceRefresh) {
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) {
          try { rawTree = JSON.parse(cached); } catch(e) {}
        }
      }

      if (!rawTree) {
        try {
          const res = await fetch(API_TREE_URL);
          if (res.ok) {
            const data = await res.json();
            rawTree = data.tree;
            sessionStorage.setItem(cacheKey, JSON.stringify(rawTree));
          } else {
            console.warn('API Rate Limit ou Erro. Usando lista fallback estática.');
            rawTree = getFallbackTree();
          }
        } catch (err) {
          console.error('Erro ao conectar com API GitHub:', err);
          rawTree = getFallbackTree();
        }
      }

      treeLoaderEl.classList.add('hidden');
      lastSyncTimeEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Filtrar apenas arquivos Markdown (.md) e ignorar arquivos que não sejam documentação
      filesTree = rawTree.filter(item => 
        item.type === 'blob' && 
        item.path.toLowerCase().endsWith('.md') &&
        !item.path.includes('.github')
      );

      renderSidebar(filesTree);

      // Carregar arquivo da URL (hash) ou abrir o README.md / iniciar.md por padrão
      const requestedPath = window.location.hash.replace('#', '');
      const defaultFile = filesTree.find(f => f.path === requestedPath) || 
                          filesTree.find(f => f.path.toLowerCase() === 'readme.md') || 
                          filesTree[0];

      if (defaultFile) {
        loadFileContent(defaultFile.path);
      }
    }

    // Fallback caso a API do GitHub atinja o limite por IP
    function getFallbackTree() {
      return [
        { path: 'README.md', type: 'blob' },
        { path: 'iniciar.md', type: 'blob' },
        { path: 'global/regras_globais.md', type: 'blob' },
        { path: 'tecnologia/arquitetura_stack.md', type: 'blob' },
        { path: 'tecnologia/seguranca_codigo.md', type: 'blob' },
        { path: 'governanca/logs_e_documentacao.md', type: 'blob' },
        { path: 'interface/padroes_ui.md', type: 'blob' }
      ];
    }

    // 2. Renderizar Menu Lateral Organizado por Pastas (Seções Dinâmicas)
    function renderSidebar(files) {
      navTreeEl.innerHTML = '';

      // Agrupar arquivos por pasta
      const groups = {};

      files.forEach(file => {
        const parts = file.path.split('/');
        const folder = parts.length > 1 ? parts[0] : 'root';
        if (!groups[folder]) groups[folder] = [];
        groups[folder].push(file);
      });

      // Ordenação prioritária das seções
      const priorityOrder = ['root', 'global', 'tecnologia', 'governanca', 'interface'];
      const sortedKeys = Object.keys(groups).sort((a, b) => {
        const idxA = priorityOrder.indexOf(a);
        const idxB = priorityOrder.indexOf(b);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        return a.localeCompare(b);
      });

      sortedKeys.forEach(folderKey => {
        const groupFiles = groups[folderKey];
        const sectionTitle = SECTION_LABELS[folderKey] || folderKey.toUpperCase();

        const sectionEl = document.createElement('div');
        sectionEl.className = 'nav-section';

        const headerEl = document.createElement('div');
        headerEl.className = 'text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-1.5 px-2.5 flex items-center justify-between';
        headerEl.innerHTML = `
          <span>${sectionTitle}</span>
          <span class="text-[10px] font-normal text-slate-300">${groupFiles.length}</span>
        `;
        sectionEl.appendChild(headerEl);

        const listEl = document.createElement('ul');
        listEl.className = 'space-y-0.5';

        groupFiles.forEach(file => {
          const parts = file.path.split('/');
          const fileName = parts[parts.length - 1];
          const displayName = formatFileName(fileName);

          const li = document.createElement('li');
          const btn = document.createElement('button');
          btn.dataset.path = file.path;
          btn.className = `nav-item w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-medium transition-colors flex items-center justify-between ${
            activeFilePath === file.path ? 'bg-sky-50 text-sky-700 font-semibold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
          }`;

          btn.innerHTML = `
            <span class="truncate">${displayName}</span>
            <span class="text-[10px] text-slate-300 font-mono">.md</span>
          `;

          btn.addEventListener('click', () => {
            loadFileContent(file.path);
            if (window.innerWidth < 1024) toggleMobileMenu();
          });

          li.appendChild(btn);
          listEl.appendChild(li);
        });

        sectionEl.appendChild(listEl);
        navTreeEl.appendChild(sectionEl);
      });
    }

    // 3. Buscar e Renderizar o Conteúdo do Arquivo Markdown
    async function loadFileContent(filePath) {
      activeFilePath = filePath;
      window.location.hash = filePath;

      // Atualizar estilo ativo no menu
      document.querySelectorAll('.nav-item').forEach(el => {
        if (el.dataset.path === filePath) {
          el.className = 'nav-item w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-sky-50 text-sky-700 transition-colors flex items-center justify-between';
        } else {
          el.className = 'nav-item w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors flex items-center justify-between';
        }
      });

      // Atualizar Breadcrumb e Título
      const parts = filePath.split('/');
      const section = parts.length > 1 ? parts[0] : 'root';
      const fileName = parts[parts.length - 1];

      docSectionBadgeEl.textContent = SECTION_LABELS[section] || section;
      docPathEl.textContent = filePath;
      docTitleEl.textContent = formatFileName(fileName);
      editGithubBtn.href = `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/edit/${GITHUB_BRANCH}/${filePath}`;

      // Exibir loader no corpo
      docBodyEl.innerHTML = `
        <div class="py-12 text-center text-slate-400">
          <svg class="animate-spin h-6 w-6 text-sky-600 mx-auto mb-3" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          Carregando <strong>${filePath}</strong> do GitHub...
        </div>
      `;

      // Verificar Cache Local de Conteúdo
      if (cachedFilesContent[filePath]) {
        renderMarkdown(cachedFilesContent[filePath]);
        return;
      }

      try {
        const rawUrl = `${RAW_BASE_URL}/${filePath}`;
        const res = await fetch(rawUrl);
        if (!res.ok) throw new Error(`Status ${res.status}`);
        const markdown = await res.text();
        cachedFilesContent[filePath] = markdown;
        renderMarkdown(markdown);
      } catch (err) {
        docBodyEl.innerHTML = `
          <div class="p-6 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
            <h3 class="font-bold text-base mb-1">Falha ao carregar arquivo</h3>
            <p>Não foi possível buscar o arquivo <code>${filePath}</code> em <em>${RAW_BASE_URL}</em>.</p>
            <p class="mt-2 text-xs text-red-500">Erro: ${err.message}</p>
          </div>
        `;
      }
    }

    // 4. Renderizar Markdown com suporte a Botão de Copiar Código
    function renderMarkdown(md) {
      docBodyEl.innerHTML = marked.parse(md);

      // Adicionar botão de copiar em blocos de código <pre>
      document.querySelectorAll('.markdown-body pre').forEach(pre => {
        const button = document.createElement('button');
        button.className = 'absolute top-2 right-2 px-2 py-1 text-[11px] font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded transition-colors shadow-xs';
        button.textContent = 'Copiar';

        button.addEventListener('click', async () => {
          const code = pre.querySelector('code').innerText;
          await navigator.clipboard.writeText(code);
          button.textContent = 'Copiado!';
          button.className = 'absolute top-2 right-2 px-2 py-1 text-[11px] font-medium text-emerald-300 bg-emerald-950 border border-emerald-800 rounded transition-colors';
          setTimeout(() => {
            button.textContent = 'Copiar';
            button.className = 'absolute top-2 right-2 px-2 py-1 text-[11px] font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded transition-colors shadow-xs';
          }, 2000);
        });

        pre.appendChild(button);
      });
    }

    // 5. Filtro de Busca Dinâmica na Barra Lateral
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      if (!term) {
        renderSidebar(filesTree);
        return;
      }
      const filtered = filesTree.filter(f => 
        f.path.toLowerCase().includes(term) ||
        formatFileName(f.path).toLowerCase().includes(term)
      );
      renderSidebar(filtered);
    });

    // 6. Botão de Forçar Atualização
    btnRefresh.addEventListener('click', () => {
      sessionStorage.clear();
      cachedFilesContent = {};
      loadGitHubTree(true);
    });

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      loadGitHubTree();
    });
  </script>
</body>
</html>
